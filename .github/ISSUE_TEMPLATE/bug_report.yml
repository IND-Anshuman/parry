name: Bug report
description: Something parry did wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Please don't paste prompts or API keys.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: python
  - type: input
    id: versions
    attributes:
      label: Versions
      description: 'Output of: python -c "import parry, openai, anthropic, sys; print(parry.__version__, openai.__version__, anthropic.__version__, sys.version)"'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
